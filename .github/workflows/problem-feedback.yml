name: Problem feedback

# Keep this workflow identity and previous run history. It no longer ingests reports.
on:
  workflow_dispatch:

permissions: {}

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain application-owned diagnosis
        shell: bash
        run: |
          printf '%s\n' '{"ok":false,"status":"application-owned","reason":"LEGACY_PUBLICATION_DISABLED","autoSubmit":false,"nextAction":"resolve-and-verify-in-application"}'
          printf '%s\n' 'Legacy reports remain historical evidence. Use local feedback:validate and feedback:reproduce; contribute a verified implementation or website reference after privacy review.'
