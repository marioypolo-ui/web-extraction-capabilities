name: Trusted capability auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted author and restricted paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TRUSTED_CAPABILITY_AUTHORS: ${{ vars.TRUSTED_CAPABILITY_AUTHORS }}
        shell: bash
        run: |
          set -euo pipefail
          author="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')"
          allowed=",$REPOSITORY_OWNER,${TRUSTED_CAPABILITY_AUTHORS:-},"
          case "$allowed" in
            *",$author,"*) ;;
            *) echo "Author is not trusted for automatic merge"; exit 1 ;;
          esac

          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          while IFS= read -r file; do
            case "$file" in
              capabilities/*/capability.json|capabilities/*/adapter.mjs|capabilities/*/fixtures/*|capabilities/*/tests/*|fixtures/contributions/*|tests/contributions/*) ;;
              *) echo "Forbidden automatic-merge path: $file"; exit 1 ;;
            esac
          done <<< "$files"

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash
