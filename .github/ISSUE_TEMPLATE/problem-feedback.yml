name: 历史问题反馈迁移说明
description: 未修复问题留在应用本地；中央接收已验证且获准公开的贡献。
title: "[Feedback migration] "
body:
  - type: markdown
    attributes:
      value: |
        此入口不再收集网页正文、Feedback JSON、访问清单、日志或故障样本。
        请由应用维护 agent 在本地定位、修复和验证，再按[贡献指南](https://github.com/marioypolo-ui/web-extraction-capabilities/blob/main/docs/capability-authoring.md)准备可复用成果。
        正常调用或出现失败均不需要在这里建单。站点、网络、账号和业务配置问题由应用处理。
        网站名称、栏目及其组合也可能暴露业务关系；只有经内容审查且明确获准公开的材料才能提交。
        已有 Issue、评论和证据保留原状；迁移不代表原故障修复或应用已经升级。
  - type: checkboxes
    id: migration
    attributes:
      label: 迁移确认
      options:
        - label: 我理解未修复报告应留在本地，本入口不会安排中央代修；我不会在标题或评论中粘贴业务数据。
          required: true
